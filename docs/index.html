<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Psychology Internship Support Tool</title>
  <style>
    :root {
      --navy:       #1e3a5f;
      --navy-dim:   #0c2640;
      --navy-light: #2a4d7a;
      --teal:       #0d9488;
      --teal-light: #14b8a6;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at 50% 0%, var(--navy) 0%, var(--navy-dim) 70%);
      color: #e0f2fe;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 360px;
      width: 100%;
      text-align: center;
      background: var(--navy);
      border: 1px solid var(--navy-light);
      border-radius: 16px;
      padding: 44px 36px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .headline {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }
    .sub {
      font-size: .9rem;
      line-height: 1.6;
      color: #b8cbe0;
      margin-bottom: 24px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    input {
      font: inherit;
      font-size: .95rem;
      padding: 11px 14px;
      border-radius: 8px;
      border: 1px solid var(--navy-light);
      background: var(--navy-dim);
      color: #fff;
      text-align: center;
      letter-spacing: .04em;
    }
    input::placeholder { color: #6f93b8; }
    input:focus { outline: 2px solid var(--teal-light); outline-offset: 1px; }
    button {
      font: inherit;
      font-size: .95rem;
      font-weight: 700;
      background: var(--teal);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px 14px;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: #0f766e; }
    .err {
      margin-top: 14px;
      font-size: .82rem;
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="headline">This webpage is for personal use.</p>
    <p class="sub">Please type the code to continue.</p>
    <form id="gateForm">
      <input type="text" id="codeInput" name="code" autocomplete="off" spellcheck="false"
             placeholder="Code" aria-label="Access code" required>
      <button type="submit">Enter</button>
    </form>
    <p class="err" id="gateErr" hidden>Incorrect code — try again.</p>
  </div>
  <script>
    var GATE_CODE = 'psych2026';
    var form = document.getElementById('gateForm');
    var input = document.getElementById('codeInput');
    var err = document.getElementById('gateErr');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (input.value.trim().toLowerCase() === GATE_CODE.toLowerCase()) {
        sessionStorage.setItem('gatePassed', '1');
        window.location.href = './8d3e13bbac.html';
      } else {
        err.hidden = false;
        input.value = '';
        input.focus();
      }
    });
  </script>
</body>
</html>
